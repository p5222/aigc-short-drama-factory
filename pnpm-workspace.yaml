packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - msgpackr-extract
  - prisma
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  ffmpeg-static: set this to true or false
  msgpackr-extract: true
  prisma: true
