x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    memswap_limit: 1g
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 32m
    memswap_limit: 512m
    stop_grace_period: 60s
    logging: *bounded-logging
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: manjiao-app:${MANJIAO_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        ALPINE_MIRROR: ${MANJIAO_ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
        APP_REVISION: ${MANJIAO_RELEASE:-local}
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 128m
    memswap_limit: 1536m
    init: true
    stop_grace_period: 60s
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_REVISION: ${MANJIAO_RELEASE:-local}
      NODE_OPTIONS: --max-old-space-size=${MANJIAO_NODE_HEAP_MB:-512}
      # Public traffic traverses Caddy then Nginx; the API has no host port.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      OBJECT_STORAGE_LOCAL_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
    command: ["node", "apps/api/dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(async r=>process.exit(r.ok && (await r.json()).ok === true ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - "4000"

  web:
    image: manjiao-app:${MANJIAO_RELEASE:-local}
    restart: "no"
    mem_limit: 128m
    memswap_limit: 256m
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    volumes:
      - web_dist:/publish
    command: >
      sh -ec 'cp -a apps/web/dist/assets /publish/;
      find apps/web/dist -mindepth 1 -maxdepth 1 ! -name assets ! -name index.html -exec cp -a {} /publish/ \;;
      cp apps/web/dist/index.html /publish/index.html.next;
      mv /publish/index.html.next /publish/index.html'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    memswap_limit: 128m
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web_dist:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  redis_data:
  web_dist:
  api_storage:
