services:
  postgres:
    image: postgres:16-alpine
    container_name: aigc_drama_postgres
    environment:
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: aigc
      POSTGRES_DB: aigc_drama
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aigc_drama_redis
    ports:
      - "6379:6379"

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: aigc_drama_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aigcadmin
      MINIO_ROOT_PASSWORD: aigcadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
